<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess</title>
<style>
:root{--bg:#e7eaee;--fg:#1f252c;--mut:#677280;--pan:rgba(255,255,255,.78);--ln:rgba(31,37,44,.12);--ac:#4a7bf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1e23;--fg:#eceff3;--mut:#8f9aa7;--pan:rgba(36,41,48,.8);--ln:rgba(255,255,255,.12);--ac:#7da2ff}}
:root[data-theme="dark"]{--bg:#1a1e23;--fg:#eceff3;--mut:#8f9aa7;--pan:rgba(36,41,48,.8);--ln:rgba(255,255,255,.12);--ac:#7da2ff}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.pill{position:fixed;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:var(--pan);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap}
#top{top:calc(env(safe-area-inset-top,0px) + 16px)}
#bar{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding:5px;gap:4px}
#dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--fg);background:#fff}
#dot.b{background:#2d323a;border-color:#2d323a}
button{font:inherit;color:var(--mut);background:none;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
button:hover{color:var(--fg)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sep{width:1px;height:18px;background:var(--ln);margin:0 4px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5;padding:16px;overflow:auto}
.ov[hidden]{display:none}
.card{width:min(460px,100%);max-height:100%;overflow:auto;background:var(--bg);border:1px solid var(--ln);border-radius:22px;padding:22px}
h1{font-size:24px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
h2{font-size:13px;color:var(--mut);margin:20px 0 8px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.row button{border:1px solid var(--ln);color:var(--fg)}
.row button[aria-pressed="true"]{color:var(--bg)}
.chip::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px;vertical-align:-2px;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);border:1px solid var(--ln)}
label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;margin-right:6px}
input[type=color]{width:34px;height:26px;border:1px solid var(--ln);border-radius:8px;padding:0;background:none;cursor:pointer}
input[type=text],select{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--ln);border-radius:999px;padding:7px 12px}
input[type=text]{width:84px;text-transform:uppercase}
input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mut{color:var(--mut);font-size:13px;margin:4px 0 0;min-height:18px}
button.primary{width:100%;margin-top:18px;background:var(--fg);color:var(--bg);padding:11px}
button.primary:hover{color:var(--bg);opacity:.9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="pill" id="top"><span id="dot"></span><span id="st">White to move</span></div>
<div class="pill" id="bar">
  <button id="menuBtn">Menu</button>
  <span class="sep"></span>
  <button id="undo">Undo</button>
  <button id="new">New game</button>
</div>
<div class="ov" id="menu" role="dialog" aria-modal="true" aria-label="Game menu"><div class="card">
  <h1>Chess</h1>
  <h2>Play</h2>
  <div class="row"><button id="m1" aria-pressed="true">Computer</button><button id="m2" aria-pressed="false">Same device</button></div>
  <div class="row"><label for="elo">Computer strength</label><input type="range" id="elo" min="400" max="2400" step="100" value="1200"><span class="mut" id="eloT" style="margin:0"></span></div>

  <p class="mut" id="net">Online rooms need friends who have access to this page.</p>
  <h2>Scene</h2>
  <div class="row" id="scenes"></div>
  <h2>Colors</h2>
  <div class="row" id="presets"></div>
  <div class="row" id="pick"></div>
  <h2>Sound</h2>
  <div class="row"><button id="mus" aria-pressed="true">Music</button><select id="trk" aria-label="Music style"></select><input type="range" id="vol" min="0" max="1" step=".05" value=".5" aria-label="Volume"><button id="sfx" aria-pressed="true">Move sounds</button></div>
  <button class="primary" id="go">Back to game</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- chess rules ---------- */
addEventListener('error',e=>{const s=document.getElementById('st');if(s)s.textContent='Error: '+e.message});
const D=[[1,0],[-1,0],[0,1],[0,-1]],G=[[1,1],[1,-1],[-1,1],[-1,-1]],NN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
function start(){const b=Array(64).fill(null),r='RNBQKBNR';for(let i=0;i<8;i++){b[i]='b'+r[i];b[8+i]='bP';b[48+i]='wP';b[56+i]='w'+r[i]}return{b,turn:'w',ep:-1,cr:{wK:1,wQ:1,bK:1,bQ:1}}}

function pseudo(s,nc){const o=[],b=s.b,t=s.turn;
 for(let i=0;i<64;i++){const p=b[i];if(!p||p[0]!==t)continue;const y=i>>3,x=i&7,k=p[1];
  const add=(ny,nx)=>{if(ny<0||ny>7||nx<0||nx>7)return 0;const q=b[ny*8+nx];if(q&&q[0]===t)return 0;o.push({f:i,t:ny*8+nx});return q?2:1};
  if(k==='P'){const d=t==='w'?-1:1,ny=y+d;if(ny<0||ny>7)continue;
   if(!b[ny*8+x]){o.push({f:i,t:ny*8+x});if(y===(t==='w'?6:1)&&!b[(y+2*d)*8+x])o.push({f:i,t:(y+2*d)*8+x})}
   for(const dx of[-1,1]){const nx=x+dx;if(nx<0||nx>7)continue;const q=b[ny*8+nx];
    if(q&&q[0]!==t)o.push({f:i,t:ny*8+nx});else if(!q&&s.ep===ny*8+nx)o.push({f:i,t:ny*8+nx,ep:1})}}

   if(!nc&&i===(t==='w'?60:4)){const r=t==='w'?7:0,e=a=>!b[r*8+a],op=t==='w'?'b':'w';
    if(s.cr[t+'K']&&e(5)&&e(6)&&b[r*8+7]===t+'R'&&![4,5,6].some(c=>atk(s,r*8+c,op)))o.push({f:i,t:r*8+6,c:1});
    if(s.cr[t+'Q']&&e(1)&&e(2)&&e(3)&&b[r*8]===t+'R'&&![2,3,4].some(c=>atk(s,r*8+c,op)))o.push({f:i,t:r*8+2,c:1})}}
  else{const ds=k==='B'?G:k==='R'?D:G.concat(D);for(const d of ds){let n=1;while(add(y+d[0]*n,x+d[1]*n)===1)n++}}}
 return o}
function apply(s,m){const b=s.b.slice(),p=b[m.f],t=p[0],cr={...s.cr};b[m.t]=p;b[m.f]=null;
 if(m.ep)b[(m.f>>3)*8+(m.t&7)]=null;
 if(m.c){const r=m.t>>3;if((m.t&7)===6){b[r*8+5]=b[r*8+7];b[r*8+7]=null}else{b[r*8+3]=b[r*8];b[r*8]=null}}
 if(p[1]==='P'&&(m.t>>3===0||m.t>>3===7))b[m.t]=t+'Q';
 if(p[1]==='K')cr[t+'K']=cr[t+'Q']=0;
 for(const q of[m.f,m.t]){if(q===63)cr.wK=0;if(q===56)cr.wQ=0;if(q===7)cr.bK=0;if(q===0)cr.bQ=0}
 return{b,turn:t==='w'?'b':'w',ep:p[1]==='P'&&Math.abs(m.t-m.f)===16?(m.f+m.t)/2:-1,cr}}
function inChk(s){return atk(s,s.b.indexOf(s.turn+'K'),s.turn==='w'?'b':'w')}
function legal(s){return pseudo(s).filter(m=>!inChk({...apply(s,m),turn:s.turn}))}
/* ---------- simple computer opponent ---------- */
const V={P:100,N:320,B:330,R:500,Q:900,K:0};
function ev(s){let v=0;for(let i=0;i<64;i++){const p=s.b[i];if(!p)continue;const c=7-Math.abs((i&7)-3.5)-Math.abs((i>>3)-3.5),k=p[1];

 const maxD=elo<700?1:elo<1100?2:elo<1600?3:4,sig=Math.max(0,(2100-elo)*.28);dl=Date.now()+250+Math.max(0,elo-400)*.5;

 R:[[0,0],[.18,0],[.34,0],[.36,.03],[.35,.065],[.3,.11],[.24,.16],[.2,.25],[.19,.42],[.2,.5],[.28,.535],[.3,.57],[.3,.72],[.25,.72],[.25,.66],[.12,.66],[0,.66]],
 B:[[0,0],[.18,0],[.35,0],[.37,.03],[.36,.065],[.31,.11],[.23,.17],[.14,.3],[.105,.44],[.1,.48],[.19,.52],[.2,.55],[.12,.59],[.17,.68],[.16,.78],[.1,.87],[.04,.92],[0,.93]],

/* ---------- scenes ---------- */
const envG=new THREE.Group();scene.add(envG);let env=0,RM=24;

function room(o){
 const s=new THREE.Mesh(new THREE.BoxGeometry(40,24,40),new THREE.MeshStandardMaterial({color:L(o.wall),map:o.map,side:THREE.BackSide,roughness:.85,envMapIntensity:.5,...o.wo}));s.position.y=6;envG.add(s);

const planks=(h0,l0,rep)=>{const t=tex(1024,1024,(g,w,h)=>{for(let r=0;r<8;r++){let x=-Math.random()*300;while(x<w){const len=300+Math.random()*400;g.fillStyle='hsl('+h0+',42%,'+(l0+(Math.random()-.5)*9)+'%)';g.fillRect(x,r*128,len,126);g.globalAlpha=.13;g.fillStyle='#000';for(let k=0;k<26;k++)g.fillRect(x,r*128+Math.random()*126,len,Math.random()*1.6);g.globalAlpha=1;x+=len}}});t.repeat.set(rep,rep);return t};
